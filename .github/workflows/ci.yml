
name: CI

on:
  push:
    # fullstack2 is the active line; its PR into main cannot run pull_request
    # checks while conflicted, so the branch carries its own CI on push.
    branches: [main, master, fullstack2]
  pull_request:
    branches: [main, master]

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The change-record and policy-weakening checks compare against the previous
          # commit, which a shallow clone does not have.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install governance tool
        run: uv sync --project tools/repo_governance

      # The OpenAPI export runs application code in a scrubbed subprocess, so the backend
      # environment has to exist. Without it the interfaces manifest records status unknown
      # and the regeneration comparison fails — correctly, but unhelpfully.
      - name: Install backend (for the sanitized OpenAPI export)
        run: uv sync --directory backend --dev

      # Rebuild every generated document from the sources in a clean checkout and fail if
      # the result differs from what is committed. This is the real drift gate: a stale
      # manifest and a hand-edited one are the same condition here.
      - name: Full governance check
        run: uv run --project tools/repo_governance governance check --full --verbose

      - name: Governance self-test
        run: uv run --project tools/repo_governance pytest tools/repo_governance/tests

      # Belt and braces: the check above compares rendered output against the committed
      # bytes, and this proves a real sync writes nothing new.
      - name: Confirm sync is a no-op
        run: |
          uv run --project tools/repo_governance governance sync
          git diff --exit-code

      # The interactive hooks fail open by design, so CI is the fail-closed layer: a gate
      # that cannot load its artifact, or a tracked path outside the read surface, fails
      # the merge instead of silently degrading every future session.
      - name: Read-gate smoke
        run: |
          python .claude/hooks/governance_gate.py --selftest
          echo '{"session_id":"ci","tool_name":"Read","tool_input":{"file_path":"AGENTS.md"}}' \
            | python .claude/hooks/governance_gate.py \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['hookSpecificOutput']['permissionDecision']=='allow', d"

      - name: Read-surface coverage
        run: uv run --project tools/repo_governance governance coverage

      # The agent operating surface (.claude skills, commands, rules) may cite only
      # paths, Make targets, and validator IDs that exist. Strict: stale citations fail.
      - name: Skills reference check
        run: uv run --project tools/repo_governance governance skills-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --directory backend --dev

      - name: Run ruff check
        run: uv run --directory backend ruff check app tests cli

      - name: Run ruff format check
        run: uv run --directory backend ruff format app tests cli --check

      - name: Run ty
        run: uv run --directory backend ty check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Must provide pgvector — migration 0027 runs CREATE EXTENSION vector.
        # Same digest as the db service in docker-compose.yml.
        image: pgvector/pgvector@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --directory backend --dev

      - name: Run tests
        run: uv run --directory backend pytest tests/ -v --cov=app --cov-report=xml
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Run lint
        run: bun run lint
        working-directory: frontend

      - name: Run type check
        run: bun run type-check
        working-directory: frontend

      - name: Run unit tests with coverage
        run: bun run test:coverage
        working-directory: frontend

      # Playwright E2E is local-only for now: playwright.config disables its
      # webServer on CI and the suite needs a running backend stack. Tracked as
      # a governance finding; run locally via `make playwright`.

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Run pip-audit
        # Audit the locked dependency set; uvx runs pip-audit in its own
        # ephemeral env (no project venv needed — `uv pip install` without one
        # is what broke this job originally).
        run: |
          uv export --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip --no-deps --progress-spinner=off
        working-directory: backend

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: fullstack:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fullstack:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
