
name: CI

# main is the only long-lived branch; PR branches are short-lived and auto-deleted on merge.
# Tags matching v* are release candidates for the image publish job (Phase 4 of the CI/CD
# coverage plan). workflow_dispatch lets any job be re-run on demand.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; a job that needs more (package publish) raises it locally.
permissions:
  contents: read

# A newer push to the same PR cancels the older run. Runs on main and tags are never
# cancelled mid-flight so a publish cannot be interrupted by the next commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs the registered Make target for its validator (governance/validators.json),
# so the `ci_job` a validator declares names a job that runs the same command a developer
# runs locally. Inlining a copy of the command here is what let the two drift apart.
jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The change-record and policy-weakening checks compare against the previous
          # commit, which a shallow clone does not have.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            tools/repo_governance/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install governance tool
        run: uv sync --project tools/repo_governance

      # The OpenAPI export runs application code in a scrubbed subprocess, so the backend
      # environment has to exist. Without it the interfaces manifest records status unknown
      # and the regeneration comparison fails — correctly, but unhelpfully.
      - name: Install backend (for the sanitized OpenAPI export)
        run: uv sync --directory backend --dev

      # The process checks (change records, policy weakening, coverage-floor ratchet)
      # compare against a base commit. Locally that is HEAD; on a clean CI checkout HEAD
      # is the change itself, so they would have nothing to evaluate. Pass the real base:
      # the PR's base sha, or the pre-push sha when it exists, else the parent commit.
      - name: Resolve the base commit for range checks
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            base="$BEFORE"
          else
            base=$(git rev-parse HEAD~1)
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "base=$base"

      # Rebuild every generated document from the sources in a clean checkout and fail if
      # the result differs from what is committed. This is the real drift gate: a stale
      # manifest and a hand-edited one are the same condition here.
      - name: Full governance check
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: make governance-check ARGS="--verbose --since $BASE_SHA"

      # Belt and braces: the check above compares rendered output against the committed
      # bytes, and this proves a real sync writes nothing new.
      - name: Confirm sync is a no-op
        run: |
          make governance-sync
          git diff --exit-code

      # The interactive hooks fail open by design, so CI is the fail-closed layer: a gate
      # that cannot load its artifact, or a tracked path outside the read surface, fails
      # the merge instead of silently degrading every future session.
      - name: Read-gate smoke
        run: |
          python .claude/hooks/governance_gate.py --selftest
          echo '{"session_id":"ci","tool_name":"Read","tool_input":{"file_path":"AGENTS.md"}}' \
            | python .claude/hooks/governance_gate.py \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['hookSpecificOutput']['permissionDecision']=='allow', d"

      - name: Read-surface coverage
        run: uv run --project tools/repo_governance governance coverage

      # The agent operating surface (.claude skills, commands, rules) may cite only
      # paths, Make targets, and validator IDs that exist. Strict: stale citations fail.
      - name: Skills reference check
        run: make governance-skills-check

      # Map-vs-territory: 25 files sampled with HEAD as the seed, each manifest claim about
      # them verified against the file. The governance-sample validator.
      - name: Manifest spot check
        run: make governance-sample

      # Every focus-free view renders from the current graph. artifacts/ is gitignored, so
      # the pages are uploaded for review rather than diffed.
      - name: Render governance views
        run: make governance-views

      - name: Upload governance views
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: governance-views
          path: artifacts/governance/
          retention-days: 14
          if-no-files-found: error

  # The governance tool's own quality gates: ruff, and its test suite under a ratcheted
  # coverage floor. Separate from `governance` because it needs no backend install and
  # is the tool testing itself, not the tool testing the repository.
  governance-tool:
    name: Governance tool
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: tools/repo_governance/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install governance tool
        run: uv sync --project tools/repo_governance

      # ruff check + ruff format --check — the governance-lint validator.
      - name: Lint
        run: make governance-lint

      # pytest with coverage under the fail_under floor in tools/repo_governance/pyproject.toml
      # — the governance-selftest validator.
      - name: Self-test with coverage
        run: make governance-selftest

      # Third flag on the self-hosted instance, same opt-in as the other two.
      - name: Upload governance-tool coverage to self-hosted Codecov
        if: vars.CODECOV_URL != ''
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          url: ${{ vars.CODECOV_URL }}
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: ./tools/repo_governance/coverage.xml
          flags: governance
          disable_search: true
          fail_ci_if_error: true

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --directory backend --dev

      # ruff check, ruff format --check, ty check — the backend-lint validator.
      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Must provide pgvector — migration 0027 runs CREATE EXTENSION vector.
        # Same digest as the db service in docker-compose.yml.
        image: pgvector/pgvector@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --directory backend --dev

      # The backend-coverage validator: pytest with the ratcheted fail_under floor from
      # backend/pyproject.toml, writing coverage.xml for the upload below. It is a
      # superset of backend-unit; migrations, rag-docker-integration and agent-evals run
      # as part of the same tests/ tree against the pgvector service.
      - name: Run tests with coverage
        run: make test-cov
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      # Self-hosted Codecov (Compose profile `codecov`, reachable at codecov.<DOMAIN>).
      # Opt-in: set the CODECOV_URL repository variable and the CODECOV_TOKEN secret
      # (a repository upload token from the instance, or its global upload token).
      # Unset, the step is skipped instead of falling back to codecov.io.
      - name: Upload backend coverage to self-hosted Codecov
        if: vars.CODECOV_URL != ''
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          url: ${{ vars.CODECOV_URL }}
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: ./backend/coverage.xml
          flags: backend
          disable_search: true
          fail_ci_if_error: true

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      # eslint, tsc --noEmit, vitest with the ratcheted coverage thresholds from
      # vitest.config.ts — the frontend-test validator.
      - name: Lint, type-check, unit tests with coverage
        run: make frontend-test

      # Same opt-in as the backend upload; the lcov reporter is enabled in vitest.config.ts.
      - name: Upload frontend coverage to self-hosted Codecov
        if: vars.CODECOV_URL != ''
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          url: ${{ vars.CODECOV_URL }}
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: ./frontend/coverage/lcov.info
          flags: frontend
          disable_search: true
          fail_ci_if_error: true

      # prettier --check: the frontend-format validator. LF is pinned for frontend/** in
      # .gitattributes so this means the same thing on Windows checkouts.
      - name: Format check
        run: make frontend-format-check

      # next build: the frontend-build validator. tsc --noEmit above does not catch
      # route-level, RSC boundary, or next.config failures; only a real build does.
      - name: Production build
        run: make frontend-build

  # The playwright validator: the only one that proves the browser-to-proxy-to-backend
  # chain. A real backend on the CI pgvector and redis services, migrated and seeded, with
  # LLM_PROVIDER=test so the chat specs get a deterministic reply from pydantic-ai's
  # TestModel; the frontend is the production build, started by Playwright's webServer.
  #
  # Only postgres and redis are needed (verified against backend/app/main.py's lifespan):
  # Redis is the one hard startup dependency; embedding, reranker and pgvector-store warmups
  # are try/except soft failures that log "RAG will not be available"; MinIO is touched only
  # on upload and Docling only on demand. NEXT_PUBLIC_RAG_ENABLED=false hides the RAG UI to
  # match. A future spec that uploads or searches must add the service it needs here.
  #
  # Chromium only on every push and PR; the full five-project matrix is nightly work.
  e2e:
    name: E2E (Playwright, chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Same digest as the test job and the compose db service; migrations need pgvector.
        image: pgvector/pgvector@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fullstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      # --- backend ---
      ENVIRONMENT: local
      LLM_PROVIDER: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fullstack
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      # >= 32 chars, unique per run, never a literal secret in the file.
      SECRET_KEY: e2e-only-not-a-secret-${{ github.run_id }}-${{ github.run_attempt }}-0123456789abcdef0123456789abcdef
      FRONTEND_URL: http://localhost:3000
      # The integrations spec expects the three deployment-managed MCP servers to be listed.
      # None is reachable here; the backend probes and skips them at connection time.
      MCP_SERVERS: '[{"name":"docling-internal","url":"http://docling-mcp:8000/mcp","headers":{"Host":"localhost:8000"}},{"name":"chrome-internal","url":"http://chrome-devtools-mcp:8000/mcp"},{"name":"github-internal","url":"http://github-mcp:8082/","auth":"github","allowed_tools":["get_file_contents","search_code","search_issues","issue_read","pull_request_read","list_commits"]}]'
      # Settings refuse a github-auth MCP entry without a token. This value is not a token:
      # the sidecar it would be sent to does not exist on the runner.
      GITHUB_MCP_TOKEN: e2e-placeholder-not-a-token
      # --- frontend ---
      BACKEND_URL: http://localhost:8100
      NEXT_PUBLIC_API_URL: http://localhost:8100
      NEXT_PUBLIC_WS_URL: ws://localhost:8100
      NEXT_PUBLIC_RAG_ENABLED: "false"
      # next start sets NODE_ENV=production, which would mark the auth cookies Secure over
      # plain http://localhost; the override keeps the login flow working in every browser.
      COOKIE_SECURE: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      # --- suite ---
      TEST_USER_EMAIL: test@example.com
      TEST_USER_PASSWORD: TestPassword123!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend
        run: uv sync --directory backend --no-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: frontend

      - name: Migrate and seed
        run: |
          uv run --directory backend fullstack db upgrade
          uv run --directory backend fullstack user create --email "$TEST_USER_EMAIL" --password "$TEST_USER_PASSWORD"

      - name: Start the backend
        run: |
          nohup uv run --directory backend fullstack server run --host 127.0.0.1 --port 8100 > "$RUNNER_TEMP/backend.log" 2>&1 &
          curl --silent --show-error --fail --retry 40 --retry-delay 2 --retry-connrefused \
            http://localhost:8100/api/v1/health

      - name: Build the frontend
        run: make frontend-build

      # Playwright starts `bun run start` itself (webServer in playwright.config.ts); the
      # setup project logs in and saves the storage state the browser projects reuse.
      - name: Playwright (chromium)
        run: make playwright ARGS="--project=chromium"

      - name: Upload Playwright report and backend log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-chromium
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/backend.log
          retention-days: 14
          if-no-files-found: ignore

  # The compose-check and compose-check-prod validators: every canonical file-stack and
  # profile combination must resolve. Only the docker CLI is needed, which the runner has.
  # COMPOSE_PROD reads --env-file backend/.env, so the example file stands in for it; the
  # recipe supplies its own validation values for the :? guarded variables.
  compose:
    name: Compose matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate every stack and profile
        run: |
          cp backend/.env.example backend/.env
          make compose-check

  # Repository hygiene — the hygiene and secret-scan validators. pre-commit over the whole
  # tree (a clone without the hook installed would otherwise commit whatever the hooks
  # catch and only CI would know), actionlint and zizmor over the workflows, hadolint over
  # every Dockerfile, and gitleaks over the pushed or proposed commit range. Full history is
  # deliberately not the gate: the open secrets-pushed-to-remote finding lives there.
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # gitleaks scans a commit range.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Cache pre-commit environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit, workflow linters, Dockerfile linter
        run: make hygiene

      - name: Resolve the base commit for the secret scan
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            base="$BEFORE"
          else
            base=$(git rev-parse HEAD~1)
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Secret scan over the commit range
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: make secret-scan BASE="$BASE_SHA"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # The dependency-audit validator, python half: pip-audit over the exported backend
      # and governance-tool locks and the Docling sidecar's requirements.lock. uvx runs
      # pip-audit in its own ephemeral env (no project venv needed — `uv pip install`
      # without one is what broke this job originally). Gating.
      - name: Audit Python dependency sets
        run: make audit-python

      # JavaScript half: bun audit over frontend/bun.lock and npm audit over the
      # chrome-devtools sidecar's package-lock.json. Non-gating for now: the frontend
      # carries known high findings in transitive dependencies (sharp, vitest, next-intl,
      # js-yaml, ...) that need bumping in their own session; flip continue-on-error off
      # once that lands so the step becomes a gate rather than a badge nobody reads.
      - name: Audit JavaScript dependency sets
        run: make audit-js
        continue-on-error: true

  # Every image the repository ships, built on every event so a broken Dockerfile cannot
  # reach main, and scanned by Trivy. Trivy stays advisory (exit-code 0) under the
  # trivy-image-scan promotion ladder; the JSON report is uploaded so the four-week evidence
  # the ladder asks for exists. On PRs an image whose context did not change is skipped
  # inside the job, so the job still reports success and ci-ok stays a single name.
  docker:
    name: Docker (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's changed files through the API
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
          - name: docling-mcp
            context: ./docker/mcp/docling
          - name: chrome-devtools-mcp
            context: ./docker/mcp/chrome-devtools
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Did this image's context change? (PRs only)
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            context:
              - '${{ matrix.context }}/**'
              - '.github/workflows/ci.yml'

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request' || steps.changes.outputs.context == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        if: github.event_name != 'pull_request' || steps.changes.outputs.context == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: fullstack-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Trivy scan (table, advisory)
        if: github.event_name != 'pull_request' || steps.changes.outputs.context == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fullstack-${{ matrix.name }}:ci
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Trivy scan (JSON evidence)
        if: github.event_name != 'pull_request' || steps.changes.outputs.context == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fullstack-${{ matrix.name }}:ci
          format: json
          output: trivy-${{ matrix.name }}.json
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH
        env:
          # The table step above already pulled the vulnerability DB; do not pull it twice.
          TRIVY_SKIP_DB_UPDATE: "true"

      - name: Upload Trivy report
        if: github.event_name != 'pull_request' || steps.changes.outputs.context == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.json
          retention-days: 90

  # One aggregate result for the merge-gating jobs. It is a signal, not a branch-protection
  # requirement: the repository is private on GitHub Free (protection is unavailable) and the
  # single-branch workflow pushes to main directly, which a required check would reject. It
  # exists so the publish job can depend on one name and so protection can be switched on
  # without touching the workflow.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [governance, governance-tool, lint, test, test-frontend, e2e, compose, hygiene, security, docker]
    steps:
      - name: Every gating job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq .
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  # First delivery step: the four images, rebuilt from the per-image GHA layer cache the
  # docker job just warmed, pushed to ghcr.io/<owner>/fullstack-<image>. Only after ci-ok,
  # only on pushes to main (tags `main` and `sha-<short>`) and v* tags (`X.Y.Z` and `latest`).
  # The frontend image bakes NEXT_PUBLIC_* at build time; the values come from repository
  # variables and fall back to the Dockerfile's localhost defaults, in which case that image
  # is a validation build rather than a deployable one (Vercel is the frontend's real deploy).
  publish:
    name: Publish (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ci-ok]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
          - name: docling-mcp
            context: ./docker/mcp/docling
          - name: chrome-devtools-mcp
            context: ./docker/mcp/chrome-devtools
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/fullstack-${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only the frontend Dockerfile declares these ARGs; the others ignore them.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8100' }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL || 'ws://localhost:8100' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
            NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB=${{ vars.NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB || '50' }}
            NEXT_PUBLIC_OAUTH_PROVIDERS=${{ vars.NEXT_PUBLIC_OAUTH_PROVIDERS || 'google' }}
            NEXT_PUBLIC_RAG_ENABLED=${{ vars.NEXT_PUBLIC_RAG_ENABLED || 'false' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
