
name: Nightly

# Report-only, per the scheduled-automation-does-not-change-code policy: this workflow
# never writes to the repository, opens a PR, or changes a setting. It runs the checks that
# are too slow, too broad, or too noisy for every push and PR: the full Playwright browser
# matrix, the backend suite on Windows (the development platform), the full-history secret
# scan, Trivy against a fresh vulnerability database on all four images, the dependency
# audits, and a wider governance manifest sample. A red nightly is a signal to open a
# governed session, not a blocked merge.
on:
  schedule:
    # 03:17 UTC on weekdays. Weekdays only: a private repository pays for these minutes,
    # and nobody reads a Saturday result before Monday.
    - cron: "17 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The five Playwright projects (Chromium, Firefox, WebKit, Pixel 5, iPhone 12) against
  # the same composed stack the CI e2e job uses: pgvector, redis, LLM_PROVIDER=test.
  e2e-matrix:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, "Mobile Chrome", "Mobile Safari"]
    services:
      postgres:
        image: pgvector/pgvector@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fullstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      ENVIRONMENT: local
      LLM_PROVIDER: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fullstack
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      SECRET_KEY: nightly-only-not-a-secret-${{ github.run_id }}-${{ github.run_attempt }}-0123456789abcdef0123456789abcdef
      FRONTEND_URL: http://localhost:3000
      MCP_SERVERS: '[{"name":"docling-internal","url":"http://docling-mcp:8000/mcp","headers":{"Host":"localhost:8000"}},{"name":"chrome-internal","url":"http://chrome-devtools-mcp:8000/mcp"},{"name":"github-internal","url":"http://github-mcp:8082/","auth":"github","allowed_tools":["get_file_contents","search_code","search_issues","issue_read","pull_request_read","list_commits"]}]'
      GITHUB_MCP_TOKEN: nightly-placeholder-not-a-token
      BACKEND_URL: http://localhost:8100
      NEXT_PUBLIC_API_URL: http://localhost:8100
      NEXT_PUBLIC_WS_URL: ws://localhost:8100
      NEXT_PUBLIC_RAG_ENABLED: "false"
      COOKIE_SECURE: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      TEST_USER_EMAIL: test@example.com
      TEST_USER_PASSWORD: TestPassword123!
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend
        run: uv sync --directory backend --no-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Install browsers
        run: bunx playwright install --with-deps
        working-directory: frontend

      - name: Migrate and seed
        run: |
          uv run --directory backend fullstack db upgrade
          uv run --directory backend fullstack user create --email "$TEST_USER_EMAIL" --password "$TEST_USER_PASSWORD"

      - name: Start the backend
        run: |
          nohup uv run --directory backend fullstack server run --host 127.0.0.1 --port 8100 > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
          curl --silent --show-error --fail --retry 40 --retry-delay 2 --retry-connrefused \
            http://localhost:8100/api/v1/health

      - name: Build the frontend
        run: make frontend-build

      - name: Playwright
        run: make playwright ARGS="--project=\"$PROJECT\""

      # Same as the CI e2e job: a live `uv run` process would hang setup-uv's cache prune.
      - name: Stop the backend
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/backend.pid" ]; then
            pkill -TERM -P "$(cat "$RUNNER_TEMP/backend.pid")" || true
            kill -TERM "$(cat "$RUNNER_TEMP/backend.pid")" || true
          fi
          pkill -f "fullstack server run" || true

      - name: Upload Playwright report and backend log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ strategy.job-index }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/backend.log
          retention-days: 14
          if-no-files-found: ignore

  # The suite on the platform it is developed on. Mocked-session tests need no services;
  # migration tests self-skip. Windows minutes bill at 2x, which is why this is nightly.
  backend-windows:
    name: Backend tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --directory backend --dev

      - name: Run tests
        run: uv run --directory backend pytest tests/ -q --no-cov

  # Full-history secret scan against the committed fingerprint baseline: the three findings
  # of the open secrets-pushed-to-remote finding (commit aaec6463, backend/.env.example) are
  # subtracted, so this fails only on a leak that is not already recorded. The finding itself
  # is closed by rotation at the provider, not by this baseline. The CI hygiene job gates
  # the pushed range without a baseline.
  secret-scan-history:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: gitleaks over all history, minus the recorded baseline
        run: make secret-scan BASELINE=1

  # Trivy on all four images with a fresh vulnerability database. The CI docker job scans
  # on every push; this catches advisories published since the last push.
  trivy-fresh:
    name: Trivy (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
          - name: docling-mcp
            context: ./docker/mcp/docling
          - name: chrome-devtools-mcp
            context: ./docker/mcp/chrome-devtools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: fullstack-${{ matrix.name }}:nightly
          cache-from: type=gha,scope=${{ matrix.name }}

      - name: Trivy scan (advisory)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fullstack-${{ matrix.name }}:nightly
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Trivy scan (JSON evidence)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fullstack-${{ matrix.name }}:nightly
          format: json
          output: trivy-nightly-${{ matrix.name }}.json
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH
        env:
          TRIVY_SKIP_DB_UPDATE: "true"

      - name: Upload Trivy report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-nightly-${{ matrix.name }}
          path: trivy-nightly-${{ matrix.name }}.json
          retention-days: 90

  # Dependency audits against the day's advisory databases, and a wider manifest sample.
  audits-and-sample:
    name: Audits and manifest sample
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Audit every dependency set
        run: make audit
        continue-on-error: true

      - name: Install governance tool and backend
        run: |
          uv sync --project tools/repo_governance
          uv sync --directory backend --dev

      - name: Manifest spot check, four times the CI sample
        run: make governance-sample ARGS="--count 100"
