[project]
name = "fullstack"
version = "0.1.0"
description = "Harness"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Steven", email = "stepoldev@gmail.com" },
]

dependencies = [
    # TODO: unpin once FastAPI fixes empty-path routes (regression in 0.137).
    "fastapi>=0.135.3,<0.137",
    "uvicorn[standard]>=0.43.0",
    "pydantic[email]>=2.12.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.20",
    "logfire[fastapi,asyncpg,redis,httpx]>=4.30.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.18.0",
    "greenlet>=3.2.0",
    # HMAC HS256 only — no asymmetric keys, no `cryptography` extra.
    "pyjwt>=2.9.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.12",
    "authlib>=1.3.0",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "fastapi-cache2>=0.2.2",
    # fastapi_cache imports starlette.templating which requires Jinja2 even
    # when no templates are rendered.
    "jinja2>=3.1.0",
    # 0.15.16 is broken against every FastAPI without the private _get_body_field
    # helpers (i.e. anything below 0.140.5, which includes the pin above): its
    # ImportError fallback binds the public get_body_field but still sets
    # _get_body_field_new_signature = True, so add_pagination() calls it with a
    # body_params kwarg it does not accept and the app dies on import. Lift the
    # cap once upstream fixes the fallback or the FastAPI pin moves past 0.140.5.
    "fastapi-pagination>=0.12.31,<0.15.16",
    "sqladmin>=0.24.0",
    "itsdangerous>=2.2.0",
    "taskiq[reload]>=0.11.0",
    "taskiq-redis>=1.0.0",
    "taskiq-dependencies>=0.1.0",
    "boto3>=1.42.0",
    "pydantic-ai-slim[openrouter,duckduckgo,web-fetch]>=1.80.0",
    # MCP client transports + toolset support (Settings → Integrations).
    "pydantic-ai-slim[mcp]>=1.80.0",
    # Vector store
    # pgvector uses existing asyncpg + sqlalchemy (no extra dep needed)
    # Text splitting
    "langchain-text-splitters>=0.4.0",
    # BM25 for hybrid search
    "rank-bm25>=0.2.2",
    # Embeddings and reranking use Docker Model Runner over HTTP.
    "pymupdf>=1.25.0",
    "pillow>=10.0.0",
    "python-docx>=1.1.0",
    "llama-cloud>=1.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "boto3>=1.42.0",
    "httpx>=0.28.0",
    "click>=8.1.0",
    "tabulate>=0.9.0",
    "tqdm>=4.66.0",
    "tavily-python>=0.5.0",
    "pydantic-monty>=0.0.19",
    "pydantic-ai-skills>=0.11.0",
    "pydantic-ai-todo[postgres]>=0.2.1",
    "subagents-pydantic-ai>=0.2.7",
    "summarization-pydantic-ai>=0.1.7",
    "cryptography>=44.0.0",
    "resend>=2.35.0",
    "aiosmtplib>=5.1.2",
    "pydantic-ai-backend[console,docker,remote]>=0.2.29",
]

# PEP 735 dependency group — installed by `uv sync` / `uv sync --dev` and
# excluded by `--no-dev`. (A `dev` extra under [project.optional-dependencies]
# only installed via uv's deprecated dev-extra special-casing, so `uv sync --dev`
# could skip it on some uv versions and leave pre-commit/ruff/ty unspawnable.)
[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "anyio[trio]>=4.9.0",
    "pytest-cov>=6.1.0",
    "httpx>=0.28.0",
    "ruff>=0.15.0",
    "ty>=0.0.29",
    "pre-commit>=4.0.0",
    "pydantic-evals>=2.21.0",
]

[project.scripts]
fullstack = "cli.commands:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by formatter)
    "E402", # module level import not at top (needed for conditional Jinja2 imports)
    "B008", # function call in default argument (needed for FastAPI Depends)
    "B905", # zip() without strict= (Python 3.10+ style, not needed)
    "RUF012", # mutable class attribute without ClassVar (used in parser base class)
    "RUF059", # unpacked variable never used (CLI destructuring pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "cli"]

[tool.ty.terminal]
# The "warn" rules below are informational — don't let them fail `ty check`.
error-on-warning = false

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = [
    "alembic/",
    "tests/",
    "cli/",
    "app/commands/",
]

[tool.ty.rules]
# FastAPI Depends() injects at runtime — default=None on typed params is intentional
invalid-parameter-default = "warn"
# Starlette/FastAPI handler signatures use Union types that ty flags
invalid-argument-type = "warn"
# ORM models with Optional fields trigger on attribute assignment
invalid-assignment = "warn"
# Callable[..., Any] doesn't expose __name__ but function objects do
unresolved-attribute = "warn"
# datetime.utcnow deprecation warnings
deprecated = "warn"
# Optional deps imported inside try/except (pymupdf, docx, faker) and
# feature-gated models referenced best-effort by the admin dashboard. These are
# expected to be absent in some configs, so don't surface them at all.
unresolved-import = "ignore"
# dict() overload matching on dynamic types from validators
no-matching-overload = "warn"
# Template uses mypy-style `# type: ignore` comments which ty doesn't recognize
unused-type-ignore-comment = "warn"
# A `# ty: ignore` needed in one database/feature config can be unused in
# another generated from the same template — don't fail on that.
unused-ignore-comment = "ignore"
# Operations on Unknown types from untyped libraries (pymupdf, etc.)
unsupported-operator = "warn"
# Third-party libs (langchain, redis-py) ship without complete type stubs;
# kwargs that work at runtime are flagged as unknown.
unknown-argument = "warn"
# redis-py / asyncio overloads return Awaitable[T] | T which ty rejects as awaitable
invalid-await = "warn"
# sessionmaker(class_=AsyncSession) returns sync sessionmaker per overloads
# but the resulting callable still produces an async context manager.
invalid-context-manager = "warn"
# Helpers like get_agent accept **kwargs but their stubs only list specific params
missing-argument = "warn"
# LangChain BaseMessage subclasses (AIMessage etc.) carry tool_calls only on
# specific subclasses; ty cannot narrow via hasattr().
not-iterable = "warn"
# Return-type widening for langgraph .compile() (StateGraph vs CompiledStateGraph)
invalid-return-type = "warn"
# LangGraph/DeepAgents runtime classes use kwargs that ty stubs don't enumerate
invalid-type-form = "warn"

# The framework agent wrappers (langchain/langgraph/deepagents/pydantic-deep)
# are thin adapters over heavily-untyped third-party libraries — LangGraph's
# Pregel.ainvoke/astream, create_agent/create_deep_agent overloads, RunnableConfig
# TypedDicts, Agent[...] generic variance. ty can't reconcile their stubs, but the
# calls are correct at runtime; silence those rule families in the adapters only
# (name-resolution rules stay on, so real typos are still caught).
[[tool.ty.overrides]]
include = ["app/agents/*_assistant.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
no-matching-overload = "ignore"
invalid-return-type = "ignore"
invalid-assignment = "ignore"
unknown-argument = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo-root cache dir, next to the basetemp that tests/conftest.py anchors there:
# the default backend/.pytest_cache has been ACL-poisoned by a foreign-context run once.
cache_dir = "../.cache/pytest-backend-cache"

[tool.coverage.run]
source = ["app"]
# Branch measurement: an untested else-path or short-circuit no longer reads as
# covered, and the reports uploaded to Codecov carry branch data. Configured here
# rather than as a --cov-branch flag so CI and `make test-cov` cannot disagree.
branch = true
omit = [
    "app/main.py",
    "app/core/logfire_setup.py",
]

[tool.coverage.report]
# Ratcheted floor over the COMBINED lines-plus-branches metric that branch = true
# produces. History: the first CI run (2026-08-05) measured ~55% line-only and the
# floor was set to 54; enabling branch measurement (2026-08-17) re-measured the same
# suite at 52.90% combined (57.95% line-only), so the floor was re-baselined to 52
# for the new metric — a stricter measure of the same tests, not a regression.
# Set one point under the measured value to absorb display rounding.
# Raise this only alongside real new tests; never lower it.
fail_under = 52
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ ==",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.fastapi-fullstack]
generator_version = "0.2.17"
generated_at = "2026-07-31T17:23:40.171144+00:00"
