services:
  app:
    environment:
      DEBUG: "true"
      ENVIRONMENT: local
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8100"
      - --reload
      - --ws
      - websockets-sansio
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/cli:/app/cli:ro

  db:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  docling-serve:
    ports:
      - "127.0.0.1:5001:5001"

  taskiq-worker:
    environment:
      DEBUG: "true"
    command:
      - taskiq
      - worker
      - app.worker.taskiq_app:broker
      - --workers
      - "1"
      - --max-async-tasks
      - "1"
      - --reload
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/cli:/app/cli:ro

  taskiq-scheduler:
    environment:
      DEBUG: "true"
    volumes:
      - ./backend/app:/app/app:ro

  frontend:
    ports:
      - "127.0.0.1:3000:3000"

  docling-mcp:
    ports:
      - "127.0.0.1:8201:8000"

  chrome-devtools-mcp:
    ports:
      - "127.0.0.1:8202:8000"

  github-mcp:
    ports:
      - "127.0.0.1:8203:8082"

  pgweb:
    ports:
      - "127.0.0.1:8081:8081"

  codecov-gateway:
    ports:
      - "127.0.0.1:8090:8090"

  # ADR-006 Decision rule 7: dev grants the workspace runtime the bridge so an
  # agent can clone and install; the isolation argument lives in the ADR.
  sandboxd:
    environment:
      SANDBOXD_RUNTIMES: workspace=${SANDBOX_RUNTIME_IMAGE:-fullstack-sandbox-runtime:local};network_mode=bridge
