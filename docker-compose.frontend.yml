# Compatibility override for existing frontend-only commands.
# Always combine with docker-compose.yml so the frontend joins service-egress.
services:
  frontend:
    profiles: []
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # This stack serves plain http on localhost; WebKit discards Secure
      # cookies over http, which silently unauthenticates Safari. The base
      # (TLS-fronted) stacks keep the production default.
      COOKIE_SECURE: "false"
