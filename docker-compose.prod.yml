services:
  # Least-privilege gate in front of the Docker API: only Traefik's discovery
  # needs (container/label listing plus /version and /_ping) are allowed;
  # create, exec, images, volumes, networks and every other mutating endpoint
  # answer 403. Traefik itself no longer touches the socket, so a Traefik
  # compromise reads container metadata instead of owning the host.
  docker-socket-proxy:
    profiles: ["edge"]
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      CONTAINERS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-socket
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2375/version"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  traefik:
    profiles: ["edge"]
    image: traefik@sha256:617c253c5d960e257ec153d582cc62f191461baba6863bd6b498ae062d3d5c19
    depends_on:
      # service_started, not service_healthy: a broken proxy healthcheck must
      # degrade discovery, not keep the edge from coming up at all.
      docker-socket-proxy:
        condition: service_started
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=fullstack_service-egress
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --accesslog=true
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - traefik_letsencrypt:/letsencrypt
    networks:
      - service-egress
      - docker-socket
    restart: unless-stopped

  app:
    environment:
      DEBUG: "false"
      ENVIRONMENT: production
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TASKIQ_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      TASKIQ_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      EMBEDDING_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8100"
      - --workers
      - "2"
      - --ws
      - websockets-sansio
    labels:
      traefik.enable: "true"
      traefik.http.routers.fullstack-api.rule: Host(`api.${DOMAIN:?DOMAIN is required}`)
      traefik.http.routers.fullstack-api.entrypoints: websecure
      traefik.http.routers.fullstack-api.tls.certresolver: letsencrypt
      traefik.http.routers.fullstack-api.middlewares: fullstack-api-ratelimit
      traefik.http.middlewares.fullstack-api-ratelimit.ratelimit.average: "100"
      traefik.http.middlewares.fullstack-api-ratelimit.ratelimit.burst: "50"
      traefik.http.services.fullstack-api.loadbalancer.server.port: "8100"
      traefik.docker.network: fullstack_service-egress
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  taskiq-worker:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TASKIQ_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      TASKIQ_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      EMBEDDING_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  taskiq-scheduler:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TASKIQ_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      TASKIQ_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      EMBEDDING_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/3

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  docling-serve:
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G

  frontend:
    environment:
      NODE_ENV: production
    labels:
      traefik.enable: "true"
      traefik.http.routers.fullstack-frontend.rule: Host(`${DOMAIN:?DOMAIN is required}`)
      traefik.http.routers.fullstack-frontend.entrypoints: websecure
      traefik.http.routers.fullstack-frontend.tls.certresolver: letsencrypt
      traefik.http.services.fullstack-frontend.loadbalancer.server.port: "3000"
      traefik.docker.network: fullstack_service-egress

  # Self-hosted Codecov is published only through Traefik at codecov.<DOMAIN>; the
  # CI uploader and browsers reach it there and nowhere else.
  codecov-gateway:
    labels:
      traefik.enable: "true"
      traefik.http.routers.fullstack-codecov.rule: Host(`codecov.${DOMAIN:?DOMAIN is required}`)
      traefik.http.routers.fullstack-codecov.entrypoints: websecure
      traefik.http.routers.fullstack-codecov.tls.certresolver: letsencrypt
      traefik.http.services.fullstack-codecov.loadbalancer.server.port: "8090"
      traefik.docker.network: fullstack_service-egress
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  codecov-frontend:
    environment:
      CODECOV_BASE_HOST: codecov.${DOMAIN:?DOMAIN is required}
      CODECOV_API_HOST: codecov.${DOMAIN:?DOMAIN is required}
      CODECOV_IA_HOST: codecov.${DOMAIN:?DOMAIN is required}
      CODECOV_SCHEME: https
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  codecov-api:
    environment:
      SETUP__CODECOV_URL: https://codecov.${DOMAIN:?DOMAIN is required}
      SETUP__CODECOV_API_URL: https://codecov.${DOMAIN:?DOMAIN is required}
      SETUP__HTTP__COOKIES_DOMAIN: codecov.${DOMAIN:?DOMAIN is required}
      SETUP__HTTP__FORCE_HTTPS: "true"
      # Storage via the public name over TLS: the presigned URLs must be reachable by CI
      # runners and browsers, and the API's own client hairpins through Traefik the same way.
      SERVICES__MINIO__HOST: codecov.${DOMAIN:?DOMAIN is required}
      SERVICES__MINIO__PORT: "443"
      SERVICES__MINIO__VERIFY_SSL: "true"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  codecov-worker:
    environment:
      SETUP__CODECOV_URL: https://codecov.${DOMAIN:?DOMAIN is required}
      SETUP__CODECOV_API_URL: https://codecov.${DOMAIN:?DOMAIN is required}
      SETUP__HTTP__COOKIES_DOMAIN: codecov.${DOMAIN:?DOMAIN is required}
      SETUP__HTTP__FORCE_HTTPS: "true"
      SERVICES__MINIO__HOST: codecov.${DOMAIN:?DOMAIN is required}
      SERVICES__MINIO__PORT: "443"
      SERVICES__MINIO__VERIFY_SSL: "true"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G

  codecov-postgres:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  codecov-timescale:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  codecov-redis:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  codecov-minio:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  # Carries exactly one conversation: Traefik -> docker-socket-proxy. No
  # egress, and no other service joins it.
  docker-socket:
    driver: bridge
    internal: true

volumes:
  traefik_letsencrypt:
