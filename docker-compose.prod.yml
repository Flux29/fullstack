services:
  traefik:
    profiles: ["edge"]
    image: traefik@sha256:617c253c5d960e257ec153d582cc62f191461baba6863bd6b498ae062d3d5c19
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=fullstack_service-egress
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --accesslog=true
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - service-egress
    restart: unless-stopped

  app:
    environment:
      DEBUG: "false"
      ENVIRONMENT: production
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TASKIQ_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      TASKIQ_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      EMBEDDING_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8100"
      - --workers
      - "2"
      - --ws
      - websockets-sansio
    labels:
      traefik.enable: "true"
      traefik.http.routers.fullstack-api.rule: Host(`api.${DOMAIN:?DOMAIN is required}`)
      traefik.http.routers.fullstack-api.entrypoints: websecure
      traefik.http.routers.fullstack-api.tls.certresolver: letsencrypt
      traefik.http.routers.fullstack-api.middlewares: fullstack-api-ratelimit
      traefik.http.middlewares.fullstack-api-ratelimit.ratelimit.average: "100"
      traefik.http.middlewares.fullstack-api-ratelimit.ratelimit.burst: "50"
      traefik.http.services.fullstack-api.loadbalancer.server.port: "8100"
      traefik.docker.network: fullstack_service-egress
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  taskiq-worker:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TASKIQ_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      TASKIQ_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      EMBEDDING_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  taskiq-scheduler:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TASKIQ_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      TASKIQ_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      EMBEDDING_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/3

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  docling-serve:
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G

  frontend:
    environment:
      NODE_ENV: production
    labels:
      traefik.enable: "true"
      traefik.http.routers.fullstack-frontend.rule: Host(`${DOMAIN:?DOMAIN is required}`)
      traefik.http.routers.fullstack-frontend.entrypoints: websecure
      traefik.http.routers.fullstack-frontend.tls.certresolver: letsencrypt
      traefik.http.services.fullstack-frontend.loadbalancer.server.port: "3000"
      traefik.docker.network: fullstack_service-egress

  # Self-hosted Codecov is published only through Traefik at codecov.<DOMAIN>; the
  # CI uploader and browsers reach it there and nowhere else.
  codecov-gateway:
    labels:
      traefik.enable: "true"
      traefik.http.routers.fullstack-codecov.rule: Host(`codecov.${DOMAIN:?DOMAIN is required}`)
      traefik.http.routers.fullstack-codecov.entrypoints: websecure
      traefik.http.routers.fullstack-codecov.tls.certresolver: letsencrypt
      traefik.http.services.fullstack-codecov.loadbalancer.server.port: "8080"
      traefik.docker.network: fullstack_service-egress
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  codecov-frontend:
    environment:
      CODECOV_BASE_HOST: codecov.${DOMAIN:?DOMAIN is required}
      CODECOV_API_HOST: codecov.${DOMAIN:?DOMAIN is required}
      CODECOV_IA_HOST: codecov.${DOMAIN:?DOMAIN is required}
      CODECOV_SCHEME: https
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  codecov-api:
    environment:
      SETUP__CODECOV_URL: https://codecov.${DOMAIN:?DOMAIN is required}
      SETUP__CODECOV_API_URL: https://codecov.${DOMAIN:?DOMAIN is required}
      SETUP__HTTP__COOKIES_DOMAIN: codecov.${DOMAIN:?DOMAIN is required}
      SETUP__HTTP__FORCE_HTTPS: "true"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  codecov-worker:
    environment:
      SETUP__CODECOV_URL: https://codecov.${DOMAIN:?DOMAIN is required}
      SETUP__CODECOV_API_URL: https://codecov.${DOMAIN:?DOMAIN is required}
      SETUP__HTTP__COOKIES_DOMAIN: codecov.${DOMAIN:?DOMAIN is required}
      SETUP__HTTP__FORCE_HTTPS: "true"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G

  codecov-postgres:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  codecov-timescale:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  codecov-redis:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  codecov-minio:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  traefik_letsencrypt:
