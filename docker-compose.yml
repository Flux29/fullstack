name: fullstack

x-backend-environment: &backend-environment
  POSTGRES_HOST: db
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-fullstack}
  REDIS_HOST: redis
  REDIS_PASSWORD: ""
  TASKIQ_BROKER_URL: redis://redis:6379/1
  TASKIQ_RESULT_BACKEND: redis://redis:6379/2
  TASKIQ_MAX_ASYNC_TASKS: "1"
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
  S3_RAG_ENDPOINT: http://minio:9000
  S3_RAG_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_RAG_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
  EMBEDDING_BASE_URL: http://model-runner.docker.internal/engines/v1
  RERANKER_BASE_URL: http://model-runner.docker.internal
  EMBEDDING_CACHE_URL: redis://redis:6379/3
  DOCLING_SERVE_URL: http://docling-serve:5001
  SANDBOX_SERVICE_URL: http://sandboxd:8080

x-backend-volumes: &backend-volumes
  - media_data:/app/media
  - models_cache:/app/models_cache
  - ./emails:/app/emails:ro

x-backend-depends: &backend-depends
  db:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy
  docling-serve:
    condition: service_healthy

# Self-hosted Codecov (profile: codecov). CATEGORY__KEY variables override the mounted
# docker/codecov/config/codecov.yml; secrets live only here, never in that file.
x-codecov-environment: &codecov-environment
  SETUP__CODECOV_URL: http://localhost:8090
  SETUP__CODECOV_API_URL: http://localhost:8090
  SETUP__HTTP__COOKIE_SECRET: ${CODECOV_COOKIE_SECRET:-change-me-before-enabling-codecov}
  SETUP__HTTP__COOKIES_DOMAIN: localhost
  GITHUB__CLIENT_ID: ${CODECOV_GITHUB_CLIENT_ID:-}
  GITHUB__CLIENT_SECRET: ${CODECOV_GITHUB_CLIENT_SECRET:-}
  GITHUB__GLOBAL_UPLOAD_TOKEN: ${CODECOV_GLOBAL_UPLOAD_TOKEN:-}
  GITHUB__WEBHOOK_SECRET: ${CODECOV_GITHUB_WEBHOOK_SECRET:-}
  SERVICES__DATABASE_URL: postgres://codecov:${CODECOV_POSTGRES_PASSWORD:-codecov-change-me}@codecov-postgres:5432/codecov
  SERVICES__TIMESERIES_DATABASE_URL: postgres://codecov:${CODECOV_POSTGRES_PASSWORD:-codecov-change-me}@codecov-timescale:5432/codecov
  SERVICES__TA_TIMESERIES_DATABASE_URL: postgres://codecov:${CODECOV_POSTGRES_PASSWORD:-codecov-change-me}@codecov-timescale:5432/codecov
  SERVICES__MINIO__ACCESS_KEY_ID: ${CODECOV_MINIO_ROOT_USER:-codecov}
  SERVICES__MINIO__SECRET_ACCESS_KEY: ${CODECOV_MINIO_ROOT_PASSWORD:-codecov-change-me}
  # Storage is addressed THROUGH the gateway, not at codecov-minio directly. codecov-api
  # hands uploaders presigned URLs built from this host:port verbatim and uses the same
  # value for its own S3 client, so it has to be one name that resolves both inside Docker
  # (network alias on codecov-gateway) and outside it (Windows, systemd-resolved, and
  # browsers resolve *.localhost to loopback). The gateway proxies /archive/* to MinIO and
  # passes Host through unchanged, so the SigV4 signature, which covers host, verifies.
  # Prod overrides this to the public name over https.
  SERVICES__MINIO__HOST: codecov.localhost
  SERVICES__MINIO__PORT: "8090"
  SERVICES__MINIO__VERIFY_SSL: "false"

x-codecov-depends: &codecov-depends
  codecov-postgres:
    condition: service_healthy
  codecov-timescale:
    condition: service_healthy
  codecov-redis:
    condition: service_healthy
  codecov-minio:
    condition: service_healthy

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: fullstack-backend:local
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-environment
      DEBUG: "false"
      ENVIRONMENT: staging
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8100"
      - --ws
      - websockets-sansio
    expose:
      - "8100"
    volumes: *backend-volumes
    networks:
      - data-internal
      - service-egress
      - sandbox-internal
    depends_on: *backend-depends
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8100/api/v1/health/live', timeout=5)"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  # Coding workspaces (ADR-006). Behind a profile: a deployment that does not
  # set ENABLE_CODING should not run a container holding the Docker socket.
  sandboxd:
    profiles: ["coding"]
    build:
      context: ./docker/sandboxd
      dockerfile: Dockerfile
    image: fullstack-sandboxd:local
    environment:
      # Empty is not a usable value: sandboxd refuses to start without a
      # token, because a session it opens can run commands on this host.
      # Left as a plain substitution so `compose config` still resolves
      # for the stacks that do not run this profile.
      SANDBOXD_TOKEN: ${SANDBOX_SERVICE_TOKEN:-}
      SANDBOXD_WORKSPACE_ROOT: /workspaces
      # Egress is a per-stack edit on the runtime entry below (ADR-006 Decision
      # rule 7): the entry's network_mode overrides SANDBOXD_NETWORK_MODE
      # (verified against 0.2.29, whose shipped allowlist hardcodes bridge), so
      # isolation is pinned where it is decided. The service-wide default stays
      # as the backstop - a future entry that omits network_mode fails closed.
      SANDBOXD_NETWORK_MODE: none
      SANDBOXD_RUNTIMES: workspace=${SANDBOX_RUNTIME_IMAGE:-fullstack-sandbox-runtime:local};network_mode=none
      SANDBOXD_DEFAULT_RUNTIME: workspace
      SANDBOXD_MEM_LIMIT: ${SANDBOX_MEM_LIMIT:-2g}
      SANDBOXD_CPUS: ${SANDBOX_CPUS:-2.0}
      SANDBOXD_UI_ENABLED: "false"
    expose:
      - "8080"
    volumes:
      # Root-equivalent by construction, which is the whole reason this is a
      # separate container from the API.
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox_workspaces:/workspaces
    networks:
      - sandbox-internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=5)"
      interval: 20s
      timeout: 10s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  # Build-only: puts the workspace runtime image (docker/sandbox-runtime/) into
  # the host daemon, where sandboxd starts it for each coding session. The
  # container itself runs `true` and exits - the image is the artifact. It is a
  # service so `compose --profile coding up/build` keeps it current alongside
  # sandboxd, rather than a hand-run docker build that drifts.
  sandbox-runtime:
    profiles: ["coding"]
    build:
      context: ./docker/sandbox-runtime
      dockerfile: Dockerfile
    image: ${SANDBOX_RUNTIME_IMAGE:-fullstack-sandbox-runtime:local}
    command: ["true"]
    restart: "no"
    network_mode: none

  db:
    image: pgvector/pgvector@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fullstack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data-internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis@sha256:c29e49ab2f85760a3827b53882e6dd9f5c6c3f0bb7d724e07bb31cbf275a5236
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis_data:/data
    networks:
      - data-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio-local@sha256:978f75e6d6240261fd3a2f6a760729f45f30ea11fd1cf8b51391694c6fb279d0
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    networks:
      - data-internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  docling-serve:
    image: ghcr.io/docling-project/docling-serve-cu128@sha256:6b27338eea4981a8c51c3cdccda83441a62053ce5cf708f4fdf70aad5f3c10e8
    gpus: all
    environment:
      DOCLING_DEVICE: cuda:0
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      DOCLING_SERVE_ENG_LOC_SHARE_MODELS: "true"
      DOCLING_SERVE_ARTIFACTS_PATH: /modelcache
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "false"
      NVIDIA_VISIBLE_DEVICES: all
    expose:
      - "5001"
    volumes:
      - docling_models:/modelcache:ro
    networks:
      - service-egress
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=5)"
      interval: 20s
      timeout: 10s
      start_period: 90s
      retries: 10
    restart: unless-stopped

  taskiq-worker:
    image: fullstack-backend:local
    pull_policy: never
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-environment
      DEBUG: "false"
    command:
      - taskiq
      - worker
      - app.worker.taskiq_app:broker
      - --workers
      - "1"
      - --max-async-tasks
      - "1"
    volumes: *backend-volumes
    networks:
      - data-internal
      - service-egress
    depends_on: *backend-depends
    healthcheck:
      disable: true
    restart: unless-stopped

  taskiq-scheduler:
    image: fullstack-backend:local
    pull_policy: never
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-environment
      DEBUG: "false"
    command:
      - taskiq
      - scheduler
      - app.worker.taskiq_app:scheduler
    volumes:
      - media_data:/app/media
    networks:
      - data-internal
      - service-egress
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8100}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8100}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
        NEXT_PUBLIC_OAUTH_PROVIDERS: ${NEXT_PUBLIC_OAUTH_PROVIDERS:-google}
        NEXT_PUBLIC_RAG_ENABLED: "true"
    image: fullstack-frontend:local
    environment:
      NODE_ENV: production
      BACKEND_URL: http://app:8100
      BACKEND_WS_URL: ws://app:8100
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_RAG_ENABLED: "true"
    expose:
      - "3000"
    networks:
      - service-egress
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  docling-mcp:
    profiles: ["mcp"]
    build:
      context: ./docker/mcp/docling
    environment:
      DOCLING_CONVERSION_MODE: remote
      DOCLING_SERVICE_URL: http://docling-serve:5001
      DOCLING_SERVICE_TIMEOUT: "600"
      DOCLING_SERVICE_MAX_RETRIES: "2"
      DOCLING_FALLBACK_TO_LOCAL: "false"
      CACHE_DIR: /cache
    expose:
      - "8000"
    volumes:
      - docling_mcp_cache:/cache
    networks:
      - service-egress
    depends_on:
      docling-serve:
        condition: service_healthy
    restart: unless-stopped

  browserless:
    profiles: ["mcp"]
    image: ghcr.io/browserless/chromium@sha256:07f6561d607b80312cc9b2500e98e40cf1eb0276fb647984fa074c96b9dd41dc
    environment:
      TOKEN: ${BROWSERLESS_TOKEN:-change-me-before-enabling-mcp}
      CONCURRENT: "2"
      TIMEOUT: "600000"
      QUEUED: "2"
    expose:
      - "3000"
    networks:
      - service-egress
    restart: unless-stopped

  chrome-devtools-mcp:
    profiles: ["mcp"]
    build:
      context: ./docker/mcp/chrome-devtools
    environment:
      BROWSERLESS_TOKEN: ${BROWSERLESS_TOKEN:-change-me-before-enabling-mcp}
    expose:
      - "8000"
    networks:
      - service-egress
    depends_on:
      browserless:
        condition: service_started
    restart: unless-stopped

  github-mcp:
    profiles: ["mcp"]
    image: ghcr.io/github/github-mcp-server@sha256:d5a18c04b92714c309eb46a2305087e91a4dbd80420f6e462656699f95093520
    command:
      - http
      - --port
      - "8082"
      - --listen-host
      - 0.0.0.0
      - --read-only
      - --tools
      - get_file_contents,search_code,search_issues,issue_read,pull_request_read,list_commits
    environment:
      GITHUB_READ_ONLY: "1"
    expose:
      - "8082"
    networks:
      - service-egress
    restart: unless-stopped

  pgweb:
    profiles: ["db-ui"]
    image: sosedoff/pgweb@sha256:a5256d416e2e8b92d69a4459058e3eca33a9f075d8325491644411d0bc3bd70b
    environment:
      PGWEB_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-fullstack}?sslmode=disable
    expose:
      - "8081"
    networks:
      - data-internal
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # --- Self-hosted Codecov (profile: codecov) -------------------------------------
  # Pinned to the latest-calver release set: api/worker 26.5.18, frontend/gateway 26.4.1.
  # https://docs.codecov.com/docs/configuration
  codecov-gateway:
    profiles: ["codecov"]
    image: codecov/self-hosted-gateway:26.4.1@sha256:24ec18b65a79658c9e2dfeec6f11cda1fd905f49776e538c706abd02baa786e4
    environment:
      # Listen on 8090 inside the container too, so the storage host:port the API signs
      # (codecov.localhost:8090) is identical whether resolved in Docker or on the host.
      CODECOV_GATEWAY_HTTP_PORT: "8090"
      CODECOV_GATEWAY_MINIO_ENABLED: "true"
      # Upstream defaults resolve api/frontend/minio, which would collide with the
      # application's own services on shared networks.
      CODECOV_API_HOST: codecov-api
      CODECOV_IA_HOST: codecov-api
      CODECOV_DEFAULT_HOST: codecov-frontend
      CODECOV_MINIO_HOST: codecov-minio
    volumes:
      - ./docker/codecov/config:/config:ro
    expose:
      - "8090"
    networks:
      service-egress: {}
      codecov-internal:
        aliases:
          # The storage host codecov-api and codecov-worker sign into presigned URLs; see
          # SERVICES__MINIO__HOST. Alias only here, so it never shadows anything on
          # service-egress.
          - codecov.localhost
    depends_on:
      codecov-api:
        condition: service_healthy
      codecov-frontend:
        condition: service_healthy
    healthcheck:
      # HAProxy binds IPv4 only; busybox wget resolves localhost to ::1 first.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/gateway_health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  codecov-frontend:
    profiles: ["codecov"]
    image: codecov/self-hosted-frontend:26.4.1@sha256:d0177dd141a9709eaf2bf9ff5053a708865a66a1ee2037f416b5607892d25b8c
    environment:
      # Public host as the browser sees it; overridden to codecov.<DOMAIN> in prod.
      CODECOV_BASE_HOST: localhost:8090
      CODECOV_API_HOST: localhost:8090
      CODECOV_IA_HOST: localhost:8090
      CODECOV_SCHEME: http
    volumes:
      - ./docker/codecov/config:/config:ro
    expose:
      - "8080"
    networks:
      - codecov-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/frontend_health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  codecov-api:
    profiles: ["codecov"]
    image: codecov/self-hosted-api:26.5.18@sha256:8a163b48d97754872e7602e6c07326880984ecd6a12b3e5db9c3e8c502edf379
    environment: *codecov-environment
    volumes:
      - ./docker/codecov/config:/config:ro
    expose:
      - "8000"
    networks:
      - codecov-internal
      - service-egress
    depends_on: *codecov-depends
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=5)"
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 10
    restart: unless-stopped

  codecov-worker:
    profiles: ["codecov"]
    image: codecov/self-hosted-worker:26.5.18@sha256:7641fdcea37df09a43baa737156f81c592de7380759eb2a735ca698e38d48ab5
    environment:
      <<: *codecov-environment
      RUN_ENV: ENTERPRISE
    volumes:
      - ./docker/codecov/config:/config:ro
    networks:
      - codecov-internal
      - service-egress
    depends_on:
      <<: *codecov-depends
      # Both images run migrations at boot; let the api finish first.
      codecov-api:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  codecov-postgres:
    profiles: ["codecov"]
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: codecov
      POSTGRES_PASSWORD: ${CODECOV_POSTGRES_PASSWORD:-codecov-change-me}
      POSTGRES_DB: codecov
    volumes:
      - codecov_postgres_data:/var/lib/postgresql/data
    networks:
      - codecov-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codecov -d codecov"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  codecov-timescale:
    profiles: ["codecov"]
    image: timescale/timescaledb:2.29.1-pg17@sha256:981e3016a2810fec47515e3828ad70ae97b84f4c9ef63d032180b54f61566fd6
    environment:
      POSTGRES_USER: codecov
      POSTGRES_PASSWORD: ${CODECOV_POSTGRES_PASSWORD:-codecov-change-me}
      POSTGRES_DB: codecov
    volumes:
      - codecov_timescale_data:/var/lib/postgresql/data
    networks:
      - codecov-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codecov -d codecov"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  codecov-redis:
    profiles: ["codecov"]
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - codecov_redis_data:/data
    networks:
      - codecov-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  codecov-minio:
    profiles: ["codecov"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/export"]
    environment:
      MINIO_ROOT_USER: ${CODECOV_MINIO_ROOT_USER:-codecov}
      MINIO_ROOT_PASSWORD: ${CODECOV_MINIO_ROOT_PASSWORD:-codecov-change-me}
    expose:
      - "9000"
    volumes:
      - codecov_archive_data:/export
    networks:
      - codecov-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  data-internal:
    driver: bridge
    internal: true
  # The API reaches sandboxd here and nothing else does. Internal, so a sandbox
  # service that holds the Docker socket has no route off the host, and it is a
  # separate network from data-internal so it can never reach Postgres, Redis,
  # or object storage (ADR-006 section 1, under the ADR-005 posture).
  sandbox-internal:
    driver: bridge
    internal: true
  service-egress:
    driver: bridge
  codecov-internal:
    driver: bridge
    internal: true

volumes:
  sandbox_workspaces:
  postgres_data:
  minio_data:
  media_data:
  models_cache:
  docling_mcp_cache:
  codecov_postgres_data:
  codecov_timescale_data:
  codecov_redis_data:
  codecov_archive_data:
  redis_data:
    external: true
    name: redis-data
  docling_models:
    external: true
    name: docling-models
