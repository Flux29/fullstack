# Governance contract.
#
# Versioned independently from the application. Part of the protected kernel: changes to
# this file, the change-record schema, the ownership rules, the validator registry, or the
# self-governance policy require a governance change record and an available rollback.

[governance]
version = "1.0.0"
schema_version = 1
# Tool versions that can safely interpret this contract. A newer manifest must never be
# interpreted by an older tool as though it were valid.
requires_tool = ">=1.0.0,<2.0.0"

[kernel]
# The minimal protected kernel. Everything else may evolve through the governed process;
# these cannot be weakened without an explicit, reviewed governance change.
protected_paths = [
  "governance/governance.toml",
  "governance/schemas/change-record.schema.json",
  "governance/policies/self-governance.json",
  "governance/validators.json",
  "governance/manifests/curated/ownership.json",
]

[gate]
# Read-gate configuration, compiled by `governance sync` into
# governance/manifests/generated/read-surface.json. The PreToolUse hook script reads that
# artifact, never this file. The gate is steering, not a security boundary: it fails open
# on any uncertainty and denies only on positive evidence. Modes: off | warn | deny.
# The GOVERNANCE_GATE environment variable (user-set, outside agent reach) overrides all.
mode_corpus = "deny"
mode_repo = "deny"
# Warn, not deny, since 2026-08-11: telemetry showed a session eating 7 denials with
# zero unlocks and routing around the gate - the denials cost agent turns without
# producing the navigation behavior. Warn keeps the telemetry and the nudge; the
# GOVERNANCE_GATE env var can still force deny per session.
mode_breadth = "warn"
# Discovery sweeps: a Glob/Grep whose enumeration root is one of these is navigation by
# exhaustive search rather than by the map. Denied until one scoped `governance context`
# or `governance impact` query has been recorded this session (the PostToolUse marker);
# a search rooted inside a component directory is never breadth-gated.
breadth_roots = [
  ".",
  "backend",
  "backend/app",
  "frontend",
  "frontend/src",
  "tools",
]
# Shadow candidates: logged as would-fire events in the session telemetry, never denied.
# A root is promoted to breadth_roots only with would-fire evidence, and demoted from it
# on friction evidence (see `governance gate-metrics`). Both moves are governed changes.
breadth_shadow_roots = [
  "backend/app/services",
]
# Bulk enumeration (Glob/Grep) under these roots is answered by queries, not reads:
# `governance context | impact | explain`. Reads of one named file stay allowed.
corpus_gated_roots = [
  "governance/history/",
  "governance/manifests/",
]
# The bounded governance surfaces an agent may always read whole.
corpus_bounded_surfaces = [
  "governance/Summary.md",
  "governance/catalog.json",
  "governance/governance.toml",
  "governance/schemas/",
  "governance/validators.json",
]
# Paths outside any component's ownership that a session legitimately touches.
always_allow = [
  ".claude/",
  ".fastapi-fullstack.json",
  ".gitattributes",
  ".github/",
  ".gitignore",
  ".pre-commit-config.yaml",
  "AGENTS.md",
  "CLAUDE.md",
  "CONTRIBUTING.md",
  "ENV_VARS.md",
  "MANUAL_STEPS.md",
  "Makefile",
  "README.md",
  "SECURITY.md",
  "codecov.yml",
  "docker-compose.dev.yml",
  "docker-compose.frontend.yml",
  "docker-compose.prod.yml",
  "docker-compose.yml",
  "docker/",
  "docs/",
  "emails/",
]

# ---------------------------------------------------------------------------------------
# Catalog specification.
#
# `governance sync` emits catalog.json from these entries, skipping any whose path does not
# exist yet. History is declared by class rather than one entry per record, so the catalog
# stays small enough for an agent to read routinely no matter how much history accumulates.
# ---------------------------------------------------------------------------------------

[[catalog]]
path = "governance/governance.toml"
kind = "config"
description = "The governance contract: version, protected kernel, and the catalog specification."
authority = "curated"
update = "manual"
read_when = "Changing governance versioning, the protected kernel, or what appears in the catalog."

[[catalog]]
path = "governance/catalog.json"
kind = "config"
description = "This index. The first thing to read before selecting any deeper governance material."
authority = "generated"
update = "sync"
read_when = "Always, before opening anything else under governance/."

[[catalog]]
path = "governance/Summary.md"
kind = "summary"
description = "Current architectural state, open findings, accepted exceptions, active contracts, and the most recent material changes."
authority = "generated"
update = "sync"
read_when = "Orienting on a repository you have not touched recently, or checking what is currently unresolved."

[[catalog]]
path = "governance/validators.json"
kind = "validators"
description = "Trusted validator IDs mapped to Make targets and fixed commands. The only way a validator may be invoked."
authority = "curated"
update = "manual"
read_when = "Selecting what to run to prove a change works, or adding a new validator."

[[catalog]]
path = "governance/schemas/"
kind = "schema"
description = "JSON Schemas defining every governance document. Executed by the checks, not read into context."
authority = "curated"
update = "manual"
read_when = "Authoring a new governance document by hand, or changing a document's shape."

[[catalog]]
path = "governance/graph/node-types.json"
kind = "manifest-curated"
description = "The typed node vocabulary for the repository graph. Every graph node kind an extractor may emit is declared here first."
authority = "curated"
update = "manual"
read_when = "Adding a graph extractor or a new node kind; checking what the graph can represent."

[[catalog]]
path = "governance/graph/edge-types.json"
kind = "manifest-curated"
description = "The typed edge vocabulary for the repository graph, with the provenance fields every edge instance must carry."
authority = "curated"
update = "manual"
read_when = "Adding a graph extractor or a new edge kind; checking what a graph relationship means."

[[catalog]]
path = "governance/graph/reports/cycles.json"
kind = "manifest-generated"
description = "Dependency cycles per language, each classified import-time or deferred-import."
authority = "generated"
update = "sync"
read_when = "A cycle finding fires, or before restructuring modules that import each other."

[[catalog]]
path = "governance/graph/reports/orphans.json"
kind = "manifest-generated"
description = "Modules with no importer and no explaining classification, plus counts of what each exclusion class absorbed."
authority = "generated"
update = "sync"
read_when = "An orphan finding fires, or when hunting dead code during a debt sweep."

[[catalog]]
path = "governance/graph/reports/boundaries.json"
kind = "manifest-generated"
description = "Per-page chain coverage: which pages reach the backend through which proxy handlers, which chains are broken, and where the WebSocket exception is consumed."
authority = "generated"
update = "sync"
read_when = "Planning a change that spans the proxy hop, or checking what a page actually touches."

[[catalog]]
path = "governance/views/definitions.json"
kind = "manifest-curated"
description = "The bounded views governance visualize can render: sources, focus semantics, and node budgets."
authority = "curated"
update = "manual"
read_when = "Adding or reshaping a view, or checking what governance visualize can draw."

[[catalog]]
path = "governance/graph/reports/hotspots.json"
kind = "manifest-generated"
description = "Structural centrality rankings per language view, and components whose declared invariants lack test coverage ranked by how central their code is. Churn analysis is cache-only."
authority = "generated"
update = "sync"
read_when = "Judging review depth for a change, or picking where missing invariant tests hurt most."

[[catalog]]
path = "governance/manifests/generated/components.json"
kind = "manifest-generated"
description = "Every component, compiled from directory annotations and curated declarations."
authority = "generated"
update = "sync"
read_when = "Asking what owns a path or behavior."

[[catalog]]
path = "governance/manifests/generated/services.json"
kind = "manifest-generated"
description = "Compose services resolved across the file-stack x profile matrix, plus host runtimes and volume classification."
authority = "generated"
update = "sync"
read_when = "Changing Compose files, ports, profiles, volumes, or anything about how services are exposed."

[[catalog]]
path = "governance/manifests/generated/configuration.json"
kind = "manifest-generated"
description = "Environment variables across backend, frontend, and Compose surfaces, with classification and consumers. Names only, never values."
authority = "generated"
update = "sync"
read_when = "Adding, renaming, or removing configuration, or tracing who consumes a variable."

[[catalog]]
path = "governance/manifests/generated/data-stores.json"
kind = "manifest-generated"
description = "PostgreSQL and pgvector objects, the migration graph, Redis logical databases, the two-level embedding cache, and S3 buckets."
authority = "generated"
update = "sync"
read_when = "Touching migrations, the embedding dimension contract, Redis allocations, or bucket layout."

[[catalog]]
path = "governance/manifests/generated/ai-runtime.json"
kind = "manifest-generated"
description = "Agents, tools, and MCP connections along orthogonal dimensions, with the standing security findings that constrain them."
authority = "generated"
update = "sync"
read_when = "Changing agents, toolsets, MCP configuration, or anything touching tool authorization."

[[catalog]]
path = "governance/manifests/generated/interfaces.json"
kind = "manifest-generated"
description = "HTTP contracts, the mandatory Next.js proxy hop, the WebSocket chat exception, SSE, and the WebSocket event inventory."
authority = "generated"
update = "sync"
read_when = "Changing an API route, a proxy handler, a frontend client, or a WebSocket event."

[[catalog]]
path = "governance/manifests/generated/read-surface.json"
kind = "manifest-generated"
description = "The read-gate surface: allowed path sets and gated corpus roots, compiled for the PreToolUse hook script."
authority = "generated"
update = "sync"
read_when = "Changing the [gate] table or component ownership, or diagnosing a gate decision."

[[catalog]]
path = "governance/manifests/curated/architectural-intent.json"
kind = "manifest-curated"
description = "Components with no home directory: image-only services, host runtimes, database-resident surfaces, and multi-root frontend features."
authority = "curated"
update = "manual"
read_when = "Declaring a component that cannot hold a .governance.json, or changing architectural intent."

[[catalog]]
path = "governance/manifests/curated/ownership.json"
kind = "manifest-curated"
description = "Generated-versus-curated ownership rules, the generated-file registry, and generator-divergence records."
authority = "curated"
update = "manual"
read_when = "Asking whether a file may be hand-edited, or what a generator upgrade will conflict with."

[[catalog]]
path = "governance/manifests/curated/exceptions.json"
kind = "manifest-curated"
description = "Deliberate, reviewed departures from policy, each with its reason and scope."
authority = "curated"
update = "manual"
read_when = "A check fires on something that looks intentional, or you need to record a new deliberate departure."

[[catalog]]
path = "governance/manifests/curated/tests.json"
kind = "manifest-curated"
description = "Test frameworks, gating environment variables, ratcheted coverage floors, and which declared invariants have a dedicated test. Review judgment, hand-maintained; the coverage floors mirror backend/pyproject.toml and frontend/vitest.config.ts and are updated with them."
authority = "curated"
update = "manual"
read_when = "Deciding what proves a change, or asking whether an invariant is actually covered."

[[catalog]]
path = "governance/manifests/effective/repository.json"
kind = "manifest-effective"
description = "The merged repository model: generated facts joined with curated intent, with merge conflicts surfaced explicitly."
authority = "mixed"
update = "sync"
read_when = "You need one view of a component including both what it is and what it is meant to be."

[[catalog]]
path = "governance/policies/architecture.json"
kind = "policy"
description = "Layering, component boundaries, and dependency direction rules."
authority = "curated"
update = "manual"
read_when = "Adding a dependency between components, or moving code across a boundary."

[[catalog]]
path = "governance/policies/security.json"
kind = "policy"
description = "Exposure invariants, secret handling, MCP authorization, and the standing security findings."
authority = "curated"
update = "manual"
read_when = "Changing exposure, credentials, tool authorization, or anything touching the MCP surface."

[[catalog]]
path = "governance/policies/compatibility.json"
kind = "policy"
description = "Contracts that must not break silently: the embedding dimension agreement, migration heads, WebSocket events, and catalog-to-backend mapping."
authority = "curated"
update = "manual"
read_when = "Changing a contract that something outside its own file depends on."

[[catalog]]
path = "governance/policies/process.json"
kind = "policy"
description = "Change-record requirements, CI job references, and the policy-maturity promotion ladder."
authority = "curated"
update = "manual"
read_when = "Asking whether a change needs a record, or promoting a policy to a stricter maturity."

[[catalog]]
path = "governance/policies/self-governance.json"
kind = "policy"
description = "The protected kernel rules. Blocking from day one; no automation may weaken them."
authority = "curated"
update = "manual"
read_when = "Changing governance itself."

[[catalog]]
path = "governance/history/changes/"
kind = "history-change"
description = "Structured change records, one per material governed change. Query by component, path, or date rather than reading the directory."
authority = "mixed"
update = "cli-change"
read_when = "Asking why something is the way it is, or what a recent change to this area did."

[[catalog]]
path = "governance/history/decisions/"
kind = "history-decision"
description = "Architecture decision records for durable choices. Indexed in index.json."
authority = "curated"
update = "manual"
read_when = "A component references an ADR, or you are about to revisit a durable decision."

[[catalog]]
path = "governance/history/evaluations/"
kind = "history-evaluation"
description = "Evidence about governance behavior itself: misses, false positives, and context quality."
authority = "curated"
update = "manual"
read_when = "Proposing a change to governance extraction, policy, or ranking."

[[catalog]]
path = "ENV_VARS.md"
kind = "doc"
description = "Human-readable environment variable reference, rendered from the configuration manifest. Hand edits are drift."
authority = "generated"
update = "sync"
read_when = "You want the configuration surface in prose rather than JSON."
